[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-webui-ranbooru-reforge"
version = "1.1.0"
description = "Booru prompt and local cache extension for Stable Diffusion WebUI Forge Neo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "requests-cache>=1.2,<2",
]

[tool.ranbooru]
# Forge owns these packages. They are compatibility constraints, not extension installs.
host-owned-dependencies = ["gradio==4.40.0", "Pillow<11", "numpy"]
